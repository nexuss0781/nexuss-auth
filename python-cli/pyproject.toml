[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuss-auth"
version = "1.0.0"
description = "User-authenticated project management CLI for Nexuss-auth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nexuss-auth" }]
keywords = ["authentication", "oauth", "cli", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
nexuss = "nexuss_auth_cli.cli:main"
nexuss-auth = "nexuss_auth_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
